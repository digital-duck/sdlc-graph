[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workgraph"
version = "0.0.1"
description = "SDLC-aware personal knowledge graph assistant, built on graphify and NetworkX"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "ruamel.yaml",
    "graphifyy>=0.7.19",
    "networkx",
    "pyyaml",
]

[project.optional-dependencies]
mcp = ["mcp"]
ui = ["streamlit"]
semantic = ["sentence-transformers"]
bedrock = ["boto3"]
leiden = ["graspologic; python_version < '3.13'"]
dev = ["pytest"]

[project.scripts]
workgraph = "workgraph.cli:main"

[tool.setuptools.package-data]
workgraph = ["domains/*.yaml", "data/*.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
