[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-graph"
version = "0.0.1"
description = "SDLC-aware personal knowledge graph assistant, built on graphify and NetworkX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "graphifyy>=0.7.19",
    "networkx",
    "pyyaml",
]

[project.optional-dependencies]
mcp = ["mcp"]
bedrock = ["boto3"]
leiden = ["graspologic; python_version < '3.13'"]
dev = ["pytest"]

[project.scripts]
sdlc-graph = "sdlc_graph.cli:main"

[tool.setuptools.package-data]
sdlc_graph = ["domains/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
