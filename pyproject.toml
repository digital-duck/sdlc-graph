[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workgraph"
version = "0.1.0"
description = "A knowledge layer beside Claude Code: a graph of your projects, lifecycle, products, teams and processes, with search, a Streamlit UI and private sync"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "digital-duck"}]
keywords = ["knowledge-graph", "claude-code", "sdlc", "networkx", "graphify", "developer-tools", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
requires-python = ">=3.10"
dependencies = [
    "ruamel.yaml",
    "graphifyy[sql]>=0.7.19",   # [sql]: tree-sitter grammar for .sql files
    "networkx",
    "pyyaml",
    "streamlit",                # workgraph ui
    "sentence-transformers",    # workgraph search --semantic (pulls in PyTorch)
]

[project.urls]
Homepage = "https://github.com/digital-duck/work-graph"
Documentation = "https://github.com/digital-duck/work-graph/tree/main/docs/GUIDE"
Source = "https://github.com/digital-duck/work-graph"
Issues = "https://github.com/digital-duck/work-graph/issues"

[project.optional-dependencies]
mcp = ["mcp"]
ui = []          # kept so `pip install workgraph[ui]` still works: streamlit is a default dependency now
semantic = []    # same: sentence-transformers is a default dependency now
bedrock = ["boto3"]
leiden = ["graspologic; python_version < '3.13'"]
dev = ["pytest"]

[project.scripts]
workgraph = "workgraph.cli:main"

[tool.setuptools.package-data]
workgraph = ["domains/*.yaml", "data/*.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
